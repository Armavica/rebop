[workspace]
members = ["benchmarks"]

[package]
name = "rebop"
version = "0.10.0"
authors = ["Virgile Andreani <armavica@ulminfo.fr>"]
edition = "2024"
license = "MIT"
categories = ["algorithms", "mathematics", "science", "simulation"]
homepage = "https://armavica.github.io/rebop/"
repository = "https://github.com/Armavica/rebop/"
description = "A fast stochastic simulator for chemical reaction networks"
keywords = ["gillespie-algorithm", "systems-biology", "stochastic", "scientific-computing"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3", "abi3t"], optional = true }
rand = "0.10.3"
rand_distr = "0.6.0"
winnow = "1.0.4"

[features]
pyo3 = ["dep:pyo3"]
abi3 = ["pyo3/abi3-py313"]
abi3t = ["pyo3/abi3t-py315"]

[dev-dependencies]
criterion = "0.8.2"
gungraun = "0.20.0"

[lib]
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]
bench = false

[[bin]]
name = "vilar"
path = "benchmarks/benches/vilar/vilar.rs"
bench = false

[profile.release]
lto = true
codegen-units = 1
